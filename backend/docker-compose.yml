version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: midetu_estres_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: midetu_estres
      MYSQL_USER: midetu_user
      MYSQL_PASSWORD: midetu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - midetu_network
    command: --default-authentication-plugin=mysql_native_password

  # Servidor Apache con PHP
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midetu_estres_apache
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./logs:/var/log/apache2
    depends_on:
      - mysql
    environment:
      DOCKER_ENV: "true"
      DB_HOST: mysql
      DB_USER: midetu_user
      DB_PASSWORD: midetu_password
      DB_NAME: midetu_estres
      APP_ENV: development
      JWT_SECRET: midetu_estres_jwt_secret_key_2024
    networks:
      - midetu_network

  # phpMyAdmin (opcional, para administración de la BD)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: midetu_estres_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - mysql
    networks:
      - midetu_network

volumes:
  mysql_data:
    driver: local

networks:
  midetu_network:
    driver: bridge
