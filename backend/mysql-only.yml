version: '3.8'

services:
  # Base de datos MySQL solamente
  mysql:
    image: mysql:8.0
    container_name: midetu_estres_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: midetu_estres
      MYSQL_USER: midetu_user
      MYSQL_PASSWORD: midetu_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - midetu_network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local

networks:
  midetu_network:
    driver: bridge
